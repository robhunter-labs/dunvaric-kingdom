<text x="992" y="386" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#eee9df">Quarantine</text>
<text x="992" y="412" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#8c8479">G-D · fenced · hashed</text>
