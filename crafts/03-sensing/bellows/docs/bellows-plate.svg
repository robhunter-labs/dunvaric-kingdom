<text x="52" y="386" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#eee9df">Outside</text>
<text x="52" y="412" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#8c8479">feeds · search · posts</text>
