<text x="1404" y="218" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#8c8479">to a tool, a prompt,</text>
<text x="1404" y="235" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#8c8479">or an action</text>
