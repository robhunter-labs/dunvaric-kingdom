<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="bw-t bw-d">
<title id="bw-t">Bellows: how outside content reaches a decision</title>
<desc id="bw-d">Five stations left to right. Standing questions are written first, at decision time. Outside content arrives from feeds and search. A deterministic pre-filter keeps only content whose terms overlap a live watch; the rest is dropped. A judgment step scores binding strength from 0 to 3; only 2 or 3 lands. Landed content goes into quarantine at grade G-D, fenced inert with a hash sidecar. Only a person with a named witness can promote it, and the promotion is written to a ledger. Content can inform a decision; it can never become an instruction.</desc>
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#f1b84b"/></marker><marker id="q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#7f9eff"/></marker></defs>
<rect width="1600" height="720" fill="#080808"/>
<text x="64" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="5" fill="#f1b84b">PLATE · THE GATE CALLED BELLOWS</text>
<text x="62" y="114" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#eee9df">Content may inform. It may never instruct.</text>
<text x="64" y="148" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="21" fill="#8c8479">The question is written before the answer arrives.</text>
<rect x="330" y="186" width="560" height="64" fill="none" stroke="#f1b84b" stroke-opacity=".6" stroke-dasharray="3 4"/>
<text x="350" y="212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="4" fill="#f1b84b">STANDING QUESTIONS · WRITTEN FIRST</text>
<text x="350" y="236" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#eee9df" fill-opacity=".85">the decision it informs · the terms worth a look · what a real signal would change</text>
