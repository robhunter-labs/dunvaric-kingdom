<text x="352" y="386" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#eee9df">Pre-filter</text>
<text x="352" y="412" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#8c8479">whole-phrase term overlap</text>
