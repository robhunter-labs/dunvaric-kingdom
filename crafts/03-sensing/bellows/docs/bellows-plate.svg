<text x="672" y="386" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#eee9df">Judgment</text>
<text x="672" y="412" font-family="Arial,Helvetica,sans-serif" font-size="13.5" fill="#8c8479">binding strength 0 to 3</text>
