<path d="M972 570 H1528" stroke="#eee9df" stroke-opacity=".35"/><text x="972" y="592" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="3" fill="#8c8479">CODE · FAIL-CLOSED</text>
<path d="M64 662 H1536" stroke="#eee9df" stroke-opacity=".18"/>
<text x="64" y="690" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#8c8479">Tested hard at the mechanism level. Not yet attacked end to end.</text>
